# Independent Panel. Only the operator's HTTPS edge may reach the loopback port.
name: homelab-telegram-panel
services:
  panel:
    image: ${PANEL_IMAGE:?Set an immutable panel image reference}
    user: "10001:10001"
    ports:
      - "127.0.0.1:${PANEL_HOST_PORT:-18080}:18080"
    networks: [panel]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Private ephemeral SDK workspace/state, never a shared bot mount.
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=268435456
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    stop_grace_period: 15s
    restart: "no"
    environment:
      PANEL_LISTEN: 0.0.0.0:18080
      PANEL_PUBLIC_ORIGIN: ${PANEL_PUBLIC_ORIGIN:?Set the dedicated HTTPS origin}
      PANEL_BASE_PATH: ${PANEL_BASE_PATH:-}
      PANEL_YOUTRACK_URL: ${PANEL_YOUTRACK_URL:?Set the exact YouTrack HTTPS origin}
      PANEL_PROJECT_ID: ${PANEL_PROJECT_ID:?Set the YouTrack project database ID}
      PANEL_PROJECT_KEY: ${PANEL_PROJECT_KEY:?Set the YouTrack project key}
      PANEL_OWNER_LOGIN: ${PANEL_OWNER_LOGIN:?Set the allowed YouTrack login}
      PANEL_WRITES_ENABLED: "false"
      # Provision specifically for Panel; never copy bot env/credentials.
      PANEL_CURSOR_API_KEY: ${PANEL_CURSOR_API_KEY:-}
      PANEL_CURSOR_PYTHON: /usr/local/bin/python3
      PANEL_CURSOR_WORKER: /opt/panel/worker.py
      PANEL_CURSOR_MODEL: ${PANEL_CURSOR_MODEL:-composer-2.5}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  panel:
    driver: bridge
