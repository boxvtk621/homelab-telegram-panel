# Independent Panel. Only the operator's HTTPS edge may reach the loopback port.
name: homelab-telegram-panel
services:
  panel:
    image: ${PANEL_IMAGE:?Set an immutable panel image reference}
    user: "10001:10001"
    ports:
      - "127.0.0.1:${PANEL_HOST_PORT:-18080}:18080"
    networks: [panel]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Private ephemeral Panel runtime state, never a Harness/provider mount.
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=268435456
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    stop_grace_period: 15s
    restart: "no"
    environment:
      PANEL_LISTEN: 0.0.0.0:18080
      PANEL_PUBLIC_ORIGIN: ${PANEL_PUBLIC_ORIGIN:?Set the dedicated HTTPS origin}
      PANEL_BASE_PATH: ${PANEL_BASE_PATH:-}
      # Standalone fallback only. Component deployment derives this from the
      # signed Harness registry and does not set PANEL_OWNER_ID.
      PANEL_OWNER_ID: ${PANEL_OWNER_ID:?Set the exact owner identity}
      PANEL_HARNESS_COMMANDS_ENABLED: ${PANEL_HARNESS_COMMANDS_ENABLED:-false}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  panel:
    driver: bridge
