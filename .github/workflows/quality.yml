name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/mobile-workspace/package-lock.json
      - run: make quality
      - run: docker build --build-arg VERSION="$GITHUB_SHA" -t homelab-telegram-panel:ci .
      - run: bash scripts/test-container.sh homelab-telegram-panel:ci
